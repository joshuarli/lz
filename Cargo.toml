[package]
name = "lz"
version = "0.1.3"
edition = "2024"
description = "A minimal, fast pager"

[dependencies]
regex-lite = "0.1"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.dev]
incremental = false
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = false

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

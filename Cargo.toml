[package]
name = "lz"
version = "0.1.3"
edition = "2024"
description = "A minimal, fast pager"

[dependencies]
regex-automata = { version = "=0.4.18", default-features = false, features = ["std", "syntax", "nfa-pikevm", "unicode-case", "unicode-perl", "unicode-word-boundary"] }
unicode-width = "0.2"

[dev-dependencies]
libc = "=0.2.182"
tempfile = "3"
rustybench = "0.4"
laputa-ptytest = { git = "https://github.com/laputa-systems/ptytest", rev = "2efca1cffe9f4f19bddb7208643c18de63bbbc41" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bench]]
name = "bench"
harness = false

[profile.dev]
incremental = false
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = false

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

[[test]]
name = "parity"
path = "tests/parity/main.rs"
harness = false
